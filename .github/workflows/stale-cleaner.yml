name: Automated Repository Maintenance

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight
  workflow_dispatch: # Allows you to run it manually with a button click

jobs:
  stale-cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Close Inactive and Stale Issues
      uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: '👋 This issue hasn’t seen any activity for a while. It will be closed automatically soon to keep the bioinformatics workspace clean!'
        days-before-stale: 30
        days-before-close: 7
